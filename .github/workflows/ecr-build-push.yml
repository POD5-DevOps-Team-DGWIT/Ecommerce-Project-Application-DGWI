name: Build and Push Images to ECR

on:
  push:
    branches: [main]
    paths: ['src/**', 'pb/**', '.env', '.github/workflows/ecr-build-push.yml']
  workflow_dispatch: {}

permissions:
  id-token: write 
  contents: read

concurrency: ecr-build-push

jobs:
  # ---- 0. The services to build: edit this one list ----
  services:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        run: echo 'list=["accounting","ad","agent","cart","checkout","currency","email","flagd-ui","fraud-detection","frontend","frontend-proxy","image-provider","kafka","load-generator","mcp","opamp-server","opensearch","payment","product-catalog","quote","recommendation","shipping","telemetry-docs"]' >> "$GITHUB_OUTPUT"
          # echo 'list=["accounting","ad","agent","cart","checkout","currency","email","flagd-ui","fraud-detection","frontend","frontend-proxy","image-provider","kafka","load-generator","mcp","opamp-server","opensearch","payment","product-catalog","quote","recommendation","shipping","telemetry-docs"]' >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build ${{ matrix.service }}
    needs: services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.services.outputs.list) }}
    env:
      IMAGE: ecomerce/${{ matrix.service }} # ECR repository name
      # Every Dockerfile is at src/<service>/Dockerfile, except cart's
      DOCKERFILE: ${{ matrix.service == 'cart' && 'src/cart/src/Dockerfile' || format('src/{0}/Dockerfile', matrix.service) }}
      OTEL_JAVA_AGENT_VERSION: ""
      OPENTELEMETRY_CPP_VERSION: ""
      OPAMP_GO_REF: ""
    steps:
      - uses: actions/checkout@v7

      - name: Show OIDC claims (temporary debug)
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          case $((${#PAYLOAD} % 4)) in 2) PAYLOAD="$PAYLOAD==";; 3) PAYLOAD="$PAYLOAD=";; esac
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, repository, repository_owner_id, repository_id, ref}'


      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: who ami
        run: |
           whoami

      - name: Log in to ECR (our images)
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to ECR Public (base images, avoids rate limits)
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Create the ECR repository if it doesn't exist
        run: aws ecr describe-repositories --repository-names "$IMAGE" ||
             aws ecr create-repository --repository-name "$IMAGE" --image-scanning-configuration scanOnPush=true

      - name: Read version pins from .env
        run: grep -E '^(OTEL_JAVA_AGENT_VERSION|OPENTELEMETRY_CPP_VERSION|OPAMP_GO_REF)=' .env >> "$GITHUB_ENV"

      # Self-hosted runner: free disk space left over from earlier builds
      # (layers are still reused from the GitHub Actions cache)
      - name: Free disk space
        run: |
          df -h / | tail -1
          docker builder prune -af || true
          docker image prune -af || true
          df -h / | tail -1

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64 # EKS nodes are amd64; arm64 builds ran under slow emulation
          # Reuse unchanged layers from earlier runs (one cache per service)
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          push: true
          # Version pins; services that don't use one ignore it
          build-args: |
            OTEL_JAVA_AGENT_VERSION=${{ env.OTEL_JAVA_AGENT_VERSION }}
            OPENTELEMETRY_CPP_VERSION=${{ env.OPENTELEMETRY_CPP_VERSION }}
            OPAMP_GO_REF=${{ env.OPAMP_GO_REF }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE }}:${{ github.run_number }}
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE }}:latest

  # ---- 2. Point the k8s-file repo at the new images; Argo CD deploys them ----
  
  # ---- 2. Update Kubernetes manifests; Argo CD deploys the new images ----
  update-k8s-manifests:
    name: Update Kubernetes manifests
    needs: [services, build-and-push]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kubernetes manifests repository
        uses: actions/checkout@v7
        with:
          repository: POD5-DevOps-Team-DGWIT/Ecommerce-Project-K8s-file-DGWI
          token: ${{ secrets.K8S_REPO_TOKEN }}
          path: k8s-file

      - name: Update image tags and push
        working-directory: k8s-file
        env:
          SERVICES: ${{ join(fromJSON(needs.services.outputs.list), ' ') }}
          TAG: ${{ github.run_number }}
        run: |
          set -euo pipefail

          # Update the image tags in each Kustomize layer
          for file in */kustomization.yaml; do
            [ -f "$file" ] || continue

            for svc in $SERVICES; do
              sed -i -E \
                "/ecomerce\/${svc}$/ { n; s|(newTag: ).*|\1\"${TAG}\"|; }" \
                "$file"
            done
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- */kustomization.yaml

          if git diff --cached --quiet; then
            echo "No image tag changes detected."
            exit 0
          fi

          git commit -m "Deploy images from build #${TAG}" \
            -m "Application commit: ${GITHUB_SHA}"

          git push origin HEAD:main

